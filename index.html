<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Question</title>
    <style>
        body { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            background-color: #ffe4e1; 
            font-family: 'Arial', sans-serif; 
            overflow: hidden; /* This is important to hide scrollbars as photos fall */
        }
        .container { text-align: center; padding: 20px; position: relative; z-index: 10; }
        img.main-gif { width: 250px; border-radius: 15px; margin-bottom: 20px; }
        .buttons { display: flex; justify-content: center; align-items: center; gap: 15px; }
        button { border: none; border-radius: 10px; cursor: pointer; transition: 0.2s; font-weight: bold; }
        #yes-btn { background-color: #4CAF50; color: white; padding: 15px 30px; font-size: 18px; }
        #no-btn { background-color: #f44336; color: white; padding: 10px 20px; font-size: 16px; }

        /* Animation for falling photos */
        .falling-photo {
            position: absolute;
            top: -150px;
            width: 100px; /* Adjust photo size here */
            border-radius: 10px;
            pointer-events: none;
            z-index: 5;
            animation: fall linear forwards;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        @keyframes fall {
            to {
                transform: translateY(120vh) rotate(360deg);
            }
        }
    </style>
</head>
<body>

<div class="container" id="main-container">
    <img id="display-img" class="main-gif" src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHpueG56Znd6Znd6Znd6Znd6Znd6Znd6Znd6Znd6Znd6Znd6JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1n/vO8F4fYK3veKw/giphy.gif" alt="Minion">
    <h1 id="question">Will you be my Valentine?</h1>
    <div class="buttons">
        <button id="yes-btn">Yes</button>
        <button id="no-btn">No</button>
    </div>
</div>

<script>
    const yesBtn = document.getElementById('yes-btn');
    const noBtn = document.getElementById('no-btn');
    const img = document.getElementById('display-img');
    const formUrl = "https://formspree.io/f/xzdvlynl"; 

    let noCount = 0;
    const phrases = ["No", "Are you sure?", "Really sure??", "Think again!", "Last chance!", "Surely not?", "You're breaking my heart ;(", "Wrong Choice", "How are still picking the wrong answer??"];

    // NAMES OF YOUR PHOTOS
    // Ensure these 4 files are uploaded to your GitHub repository
    const fallingImages = ["photo1.png", "photo2.png", "photo3.png", "photo4.png"];

    async function sendData(status) {
        if (formUrl === "YOUR_FORMSPREE_URL_HERE") return;
        await fetch(formUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ event: status, attempts: noCount })
        });
    }

    function startRain() {
        setInterval(() => {
            const photo = document.createElement('img');
            photo.src = fallingImages[Math.floor(Math.random() * fallingImages.length)];
            photo.classList.add('falling-photo');
            
            // Randomly position horizontally and randomize speed
            photo.style.left = Math.random() * 100 + "vw";
            photo.style.animationDuration = (Math.random() * 2 + 3) + "s"; 
            
            document.body.appendChild(photo);

            // Cleanup photos after they finish falling
            setTimeout(() => { photo.remove(); }, 5000);
        }, 300); // New photo falls every 0.3 seconds
    }

    window.onload = () => sendData("Page Opened");

    noBtn.addEventListener('click', () => {
        noCount++;
        noBtn.innerText = phrases[Math.min(noCount, phrases.length - 1)];
        const currentSize = parseFloat(window.getComputedStyle(yesBtn).fontSize);
        yesBtn.style.fontSize = (currentSize * 1.4) + "px";
        yesBtn.style.padding = (currentSize * 0.8) + "px";
    });

    yesBtn.addEventListener('click', () => {
        sendData("SAID YES!");
        startRain(); // Trigger the photos falling!
        
        document.getElementById('main-container').innerHTML = `
            <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHpueG56Znd6Znd6Znd6Znd6Znd6Znd6Znd6Znd6Znd6Znd6JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1n/l41lTfuxV5R7g6yT6/giphy.gif" class="main-gif">
            <h1>YAYYY!!! See you then! ❤️</h1>
        `;
    });
</script>
</body>
</html>
