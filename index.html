<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Question</title>
    <style>
        body { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            background-color: #ff69b4;
            font-family: 'Arial', sans-serif; 
            overflow: hidden;
        }
        
        .heart-bg, .pokemon-bg {
            position: absolute;
            font-size: 20px;
            opacity: 0.3;
            z-index: 1;
            pointer-events: none;
        }
        
        .heart-bg {
            color: #ff0000;
        }
        
        .pokemon-bg {
            width: 40px;
            height: 40px;
            object-fit: contain;
        }
        
        .container { 
            text-align: center; 
            padding: 20px; 
            position: relative; 
            z-index: 10; 
        }
        
        img.main-gif { 
            width: 250px; 
            border-radius: 15px; 
            margin-bottom: 20px; 
        }
        
        video.main-video {
            width: 250px;
            border-radius: 15px;
        }
        
        .media-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .buttons { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 15px; 
        }
        
        button { 
            border: none; 
            border-radius: 10px; 
            cursor: pointer; 
            transition: 0.2s; 
            font-weight: bold; 
        }
        
        #yes-btn { 
            background-color: #4CAF50; 
            color: white; 
            padding: 15px 30px; 
            font-size: 18px; 
        }
        
        #no-btn { 
            background-color: #f44336; 
            color: white; 
            padding: 10px 20px; 
            font-size: 16px;
        }

        .falling-photo {
            position: absolute;
            top: -150px;
            width: 100px; 
            border-radius: 10px;
            pointer-events: none;
            z-index: 5;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to { transform: translateY(120vh) rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="container" id="main-container">
    <img id="display-img" class="main-gif" src="https://media2.giphy.com/media/v1.Y2lkPTc5MGI3NjExbmpvdGh4dWkxdXl6MmVjbzVkaXBqbTF1dzBrOWo0ZjVkYnpkMm10OCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/r4UG27LD5Ee5y/giphy.gif" alt="Starting GIF">
    <h1 id="question">Will you be my Valentine?</h1>
    <div class="buttons">
        <button id="yes-btn">Yes</button>
        <button id="no-btn">No</button>
    </div>
</div>

<script>
    const yesBtn = document.getElementById('yes-btn');
    const noBtn = document.getElementById('no-btn');
    const displayImg = document.getElementById('display-img');
    const formUrl = "https://formspree.io/f/xzdvlynl"; 

    let noCount = 0;
    const phrases = ["No", "Are you sure?", "Really sure??", "Think again!", "Last chance!", "Surely not?", "You're breaking my heart ;(", "Wrong Choice", "How are still picking the wrong answer??"];

    const fallingImages = ["photo1.png", "photo2.png", "photo3.png", "photo4.png"];

    // GIF URLs based on No count
    const gifUrls = {
        0: "https://media2.giphy.com/media/v1.Y2lkPTc5MGI3NjExbmpvdGh4dWkxdXl6MmVjbzVkaXBqbTF1dzBrOWo0ZjVkYnpkMm10OCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/r4UG27LD5Ee5y/giphy.gif", // Initial
        1: "https://media.tenor.com/SPlz4CFm28AAAAACw/baby-yoda.gif", // After 1st No - Fixed Tenor URL
        4: "https://media4.giphy.com/media/v1.Y2lkPTc5MGI3NjExdWQ3YmZsNWFlaGJmd3ZyOWJka3lxbTl1YWoweXU5ajAyYzZlank3ZCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/xT5LMPj8P20jjOqZ5C/giphy.gif" // After 4th No
    };

    // Create heart and pokemon pattern
    function createHeartPattern() {
        const spacing = 80;
        const heartsX = Math.ceil(window.innerWidth / spacing);
        const heartsY = Math.ceil(window.innerHeight / spacing);
        
        for (let y = 0; y < heartsY; y++) {
            for (let x = 0; x < heartsX; x++) {
                const isPokemon = Math.random() < 0.33;
                
                if (isPokemon) {
                    const pokemon = document.createElement('img');
                    pokemon.className = 'pokemon-bg';
                    pokemon.src = 'pokemon.png';
                    pokemon.style.left = (x * spacing + 10) + 'px';
                    pokemon.style.top = (y * spacing + 10) + 'px';
                    document.body.appendChild(pokemon);
                } else {
                    const heart = document.createElement('div');
                    heart.className = 'heart-bg';
                    heart.innerHTML = '❤';
                    heart.style.left = (x * spacing + 20) + 'px';
                    heart.style.top = (y * spacing + 20) + 'px';
                    document.body.appendChild(heart);
                }
            }
        }
    }

    async function sendData(event, noAttempts = 0) {
        try {
            await fetch(formUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    event: event,
                    no_count: noAttempts,
                    timestamp: new Date().toISOString()
                })
            });
            console.log('Sent:', event, 'No count:', noAttempts);
        } catch (error) {
            console.log('Form submission error:', error);
        }
    }

    function startRain() {
        setInterval(() => {
            const photo = document.createElement('img');
            const randomImage = fallingImages[Math.floor(Math.random() * fallingImages.length)];
            photo.src = randomImage;
            photo.classList.add('falling-photo');
            photo.style.left = Math.random() * 100 + "vw";
            photo.style.animationDuration = (Math.random() * 2 + 3) + "s"; 
            
            document.body.appendChild(photo);
            setTimeout(() => { photo.remove(); }, 5000);
        }, 300);
    }

    function updateGif() {
        // Check if there's a specific GIF for this count
        if (gifUrls[noCount]) {
            displayImg.src = gifUrls[noCount];
        }
    }

    window.onload = () => {
        createHeartPattern();
        sendData("Page Opened", 0);
    };

    noBtn.addEventListener('click', () => {
        noCount++;
        noBtn.innerText = phrases[Math.min(noCount, phrases.length - 1)];
        const currentSize = parseFloat(window.getComputedStyle(yesBtn).fontSize);
        yesBtn.style.fontSize = (currentSize * 1.4) + "px";
        yesBtn.style.padding = (currentSize * 0.8) + "px";
        updateGif();
        
        sendData("Clicked No", noCount);
    });

    yesBtn.addEventListener('click', () => {
        sendData("SAID YES!", noCount);
        startRain();
        document.getElementById('main-container').innerHTML = `
            <div class="media-container">
                <img src="https://media.giphy.com/media/v1.Y2lkPWVjZjA1ZTQ3bWh0ZDFja3Zmcm56eDgwaWV0NjQ3bW5oMnphbHk5bTFncjJrcHdheCZlcD12MV9naWZzX3RyZW5kaW5nJmN0PWc/ytu2GUYbvhz7zShGwS/giphy.gif" class="main-gif">
                <video class="main-video" autoplay loop muted playsinline>
                    <source src="fish.mp4" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
            </div>
            <h1>YAYYY!!! See you then! ❤️</h1>
        `;
    });
</script>
</body>
</html>
```
